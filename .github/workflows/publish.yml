name: Publish Package

# Publishes flintfire to npm when a GitHub Release is published.
# Auth uses npm Trusted Publishing (OIDC) — no long-lived NPM_TOKEN secret.
# See: https://docs.npmjs.com/trusted-publishers/
#
# Prerequisites (one-time, on npmjs.com after the first manual publish of flintfire):
#   npm trust github --repository reggieofarrell/flintfire --file publish.yml \
#     --environment npm --allow-publish
#   (T19: --file, not --workflow. Phase 2 must create Environment `npm` before any
#   release event; this job already requires that Environment.)
# After OIDC works: Publishing access → require 2FA and disallow tokens.

on:
  release:
    types: [published]

permissions:
  # Required so the npm CLI can exchange a short-lived GitHub OIDC token
  # for publish rights. Without this, Trusted Publishing cannot authenticate.
  id-token: write
  contents: read
  packages: read

# Dependency restoration needs the private Casadega package, while the publish
# step itself remains tokenless and authenticates to npm through OIDC.
env:
  NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.github/npmrc

jobs:
  publish:
    name: Test, build, and publish
    runs-on: ubuntu-latest
    # Emulator-backed integration coverage can take longer than unit-only CI jobs.
    timeout-minutes: 20
    # Fail-closed: Environment `npm` is required. Phase 2 creates it (required reviewer,
    # prevent_self_review=false for a sole maintainer) before any release event. A publish
    # attempt before that environment exists must fail rather than skip the approval gate.
    environment: npm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Pin via .nvmrc (Node 24) so publish matches local/dev CI. Node 24
          # ships npm ≥ 11.16, which Trusted Publishing (OIDC) requires and which
          # honors `.npmrc` min-release-age.
          # setup-node@v7 no longer exports a dummy NODE_AUTH_TOKEN that would
          # otherwise intercept the OIDC publish flow when registry-url is set.
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Bind the publish to the intended release identity BEFORE doing any work.
      # The Node script is the only parser of untrusted tag_name; it emits only
      # the literals `next` or `latest` (see scripts/resolve-npm-dist-tag.cjs).
      - name: Verify release identity
        id: identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/resolve-npm-dist-tag.cjs

      # Firestore emulator (firebase emulators:exec) needs a JRE. Same setup
      # as the integration matrix job in tests.yml — without this, coverage:all fails.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          # firebase-tools@15 will require JDK 21+ for the Firestore emulator.
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        env:
          # Limit the private-package credential to dependency restoration so
          # npm Trusted Publishing remains tokenless at the publish step.
          NODE_AUTH_TOKEN: ${{ secrets.CASADEGA_PACKAGES_TOKEN }}
        run: npm ci

      - name: Restore locked shared RuleSync policy
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CASADEGA_PACKAGES_TOKEN }}
        run: npm run rules:install

      # release:verify runs docs:build (website build), which needs the website's own deps.
      - name: Install website dependencies
        run: npm --prefix website ci

      # Single canonical release gate — the SAME command PR CI is definitionally equivalent to
      # (see tests.yml). Runs: lint, type tests, manifest/lockfile agreement, runtime-only audit,
      # build, tarball allowlist + express-free root graph, packed ESM/CJS/express consumer
      # (compile + runtime load), dual-suite coverage gates, doc-link check, and website build.
      # See package.json `release:verify` and docs/development/testing.md.
      - name: Release verify
        env:
          CI: true
        run: npm run release:verify

      # release:verify's packed-consumer check runs against the dev peer only (Admin 14). Exercise the
      # full DECLARED range here too so the publish gate is not weaker than PR CI — this + the PR
      # `admin-compat` matrix are the canonical Admin coverage. release:verify already built dist/.
      - name: Admin 12/13/14 packed-consumer
        run: |
          for v in "^12.0.0" "^13.0.0" "^14.0.0"; do
            echo "--- firebase-admin $v ---"
            FLINTFIRE_ADMIN_VERSION="$v" npm run check:consumer
          done

      # Vector object-form floor (B3): firebase-admin 12 can resolve a firestore below the >= 7.10 the
      # object-form findNearest() needs. Pin the transitive firestore and FUNCTIONALLY probe object-form
      # construction at each version — 7.10 must construct, 7.9 must fail with the library's object-form
      # compatibility error. Mirrors the PR `firestore-floor-compat` matrix (review T4).
      - name: Admin 12 + @google-cloud/firestore 7.9/7.10 object-form floor packed-consumer
        run: |
          for fs in "7.9.0" "7.10.0"; do
            echo "--- @google-cloud/firestore $fs ---"
            FLINTFIRE_ADMIN_VERSION="^12.0.0" FLINTFIRE_FIRESTORE_VERSION="$fs" npm run check:consumer
          done

      # No NODE_AUTH_TOKEN — the npm CLI detects the OIDC environment and
      # authenticates via Trusted Publishing. Provenance is attached automatically
      # for public packages from public repos.
      # Dist-tag is allowlisted again here so a compromised output file cannot
      # inject an arbitrary --tag value (the Node script already emits only
      # next|latest; this case statement is the shell-side belt).
      - name: Publish to npm
        env:
          NPM_DIST_TAG: ${{ steps.identity.outputs.dist-tag }}
        run: |
          case "$NPM_DIST_TAG" in
            next|latest) ;;
            *) echo "::error::Refusing unrecognized npm dist-tag." && exit 1 ;;
          esac
          npm publish --tag "$NPM_DIST_TAG"
