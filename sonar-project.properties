# =============================================================================
# SonarQube Scanner Configuration — FlintFire
# =============================================================================
# Identity must stay in lockstep with .sonarlint/connectedMode.json. CI and
# local precheck both read these keys; renaming the project means updating both
# files before the next analysis.
sonar.projectKey=reggieofarrell_flintfire_c1ad3ea7-e526-454b-a643-ba1d352f2d16
sonar.projectName=flintfire

# Pin the server so shared local tooling, CI, and SonarQube for IDE resolve one
# authoritative endpoint. Inherited SONAR_HOST_URL values are ignored when they
# conflict with this committed identity.
sonar.host.url=https://sonar.casadega.dev

# Scan authored library source and repository tooling. The nested Starlight
# site, generated output, and dependencies never enter the scanner.
sonar.sources=src,scripts
sonar.tests=src,scripts
sonar.sourceEncoding=UTF-8

# Manual Firebase benchmark runners under src/benchmarks/ are opt-in scripts
# (npm run test:performance), not Jest suites — keep them out of analysis so
# S2187 and source metrics do not treat them as empty/production test code.
sonar.exclusions=website/**,dist/**,coverage/**,node_modules/**,src/benchmarks/**

# Co-located tests and type-level contracts remain analyzable as tests without
# inflating production duplication, complexity, or coverage.
sonar.test.inclusions=\
  src/tests/**,\
  src/**/*.test.ts,\
  src/**/*.spec.ts,\
  src/**/*.type-test.ts,\
  scripts/**/*.test.mjs

# Dual Jest suites each write their own LCOV report. SonarQube combines them
# into one project-level coverage view; that combined figure is informational
# only. Path-specific gates in scripts/check-coverage-gates.mjs remain the
# coverage authority because a line hit in either suite would otherwise count
# as covered.
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/integration/lcov.info

# Tests, tooling, and types-only modules should not dilute the coverage signal
# Sonar displays. pathTypes.ts emits no runtime code the V8 provider can hit.
sonar.coverage.exclusions=\
  **/*.d.ts,\
  src/tests/**,\
  src/benchmarks/**,\
  src/**/*.test.ts,\
  src/**/*.spec.ts,\
  src/**/*.type-test.ts,\
  scripts/**,\
  src/utils/pathTypes.ts

# Local scanner runs wait for the server-side quality gate. CI overrides this
# during upload, polls Compute Engine itself via the official quality-gate
# action, and enforces the project's new-code conditions.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Give the JavaScript analyzer the production program and the type-test program.
sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.typecheck.json

# Generated or minified assets should never contribute duplication findings.
sonar.cpd.exclusions=**/*.min.js
